packages:
    - .

allowBuilds:
    '@parcel/watcher': true
    '@vercel/speed-insights': true
    esbuild: true
    sharp: true

overrides:
    # <0.7.0 has a security vulnerability. SvelteKit 3 depends on cookie 2.x directly.
    'cookie@<0.7.0': '^1.0.0'
    yaml: '>=2.8.3'
    # svimg pins sharp 0.32, which has known vulnerabilities (<0.35.5)
    'sharp@<0.35.5': '^0.35.5'
    # node-gyp's undici range allows vulnerable versions (<8.12.2)
    'undici@>=8.0.0 <8.12.2': '^8.12.2'
